[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imurun"
version = "0.1.9"
description = "IMURUN - local-first AI coding agent. Installs, manages and runs local LLMs on your own machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shubham Mallick", email = "dev@imutechz.in" }]
keywords = ["ai", "agent", "llm", "local", "llama.cpp", "coding", "cli", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://imutechz.in"
Repository = "https://github.com/shubham001312/imurun"
Issues = "https://github.com/shubham001312/imurun/issues"

[project.scripts]
imurun = "imurun:main"

[tool.hatch.build.targets.wheel]
packages = ["imurun"]

[tool.hatch.build.targets.sdist]
include = ["imurun", "README.md", "LICENSE"]
