# IMURUN — publishing
#
# Two jobs, both driven by a version tag:
#
#   pypi   — builds the Python launcher and publishes it to PyPI using
#            trusted publishing (OIDC). No token is stored in the
#            repository: PyPI trusts this workflow for the `imurun`
#            project, and the short-lived OIDC token proves it.
#   npm    — builds the CLI and publishes it to the npm registry.
#
# The trusted publisher on PyPI is configured for:
#
#   project name     imurun
#   owner            shubham001312
#   repository       imurun
#   workflow file    workflow.yml
#   environment      pypi
#
# Triggered by pushing a tag (v0.1.1) or by running it by hand.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/imurun/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distributions
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist/

      - name: Check the distributions
        working-directory: python
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build the package
        run: bun run package

      - name: Check the package
        run: |
          cd dist/package/npm/imurun
          node -e "const p=require('./package.json'); if(!p.bin||!p.bin.imurun){console.error('no bin entry');process.exit(1)} console.log('bin:',p.bin.imurun)"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd dist/package/npm/imurun
          npm publish --access public --provenance
