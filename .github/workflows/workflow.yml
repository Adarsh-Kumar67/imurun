# IMURUN — publishing
#
# Two jobs, both driven by a version tag:
#
#   pypi   — builds the Python launcher and publishes it to PyPI using
#            trusted publishing (OIDC). No token is stored in the
#            repository: PyPI trusts this workflow for the `imurun`
#            project, and the short-lived OIDC token proves it.
#   npm    — builds the CLI and publishes it to the npm registry.
#
# The trusted publisher on PyPI is configured for:
#
#   project name     imurun
#   owner            shubham001312
#   repository       imurun
#   workflow file    workflow.yml
#   environment      pypi
#
# Triggered by pushing a tag (v0.1.1) or by running it by hand.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/imurun/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distributions
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist/

      - name: Check the distributions
        working-directory: python
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The distributions are built under python/, not the workspace root.
          packages-dir: python/dist
          # The trusted publisher on PyPI is configured for the `pypi`
          # environment, and this workflow must use the same one.
          environment: pypi

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm verifies this workflow with a short-lived OIDC
      # credential, so no npm token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build the package
        run: bun run package

      - name: Check the package
        run: |
          cd dist/package/npm/imurun
          node -e "const p=require('./package.json'); if(!p.bin||!p.bin.imurun){console.error('no bin entry');process.exit(1)} console.log('bin:',p.bin.imurun)"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: dist/package/npm/imurun
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Publishing to npm needs one of two things:
          #   - a trusted publisher configured on npmjs.com for this
          #     repository and this workflow file (no secret at all), or
          #   - an NPM_TOKEN secret in the repository settings.
          # With a token, npm uses it. Without one, npm exchanges the OIDC
          # credential itself - which only works when the trusted publisher
          # exists. If neither is in place the step says so and stops, rather
          # than failing the whole release with a bare ENEEDAUTH.
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --provenance
          elif npm publish --access public --provenance; then
            echo "Published to npm with trusted publishing."
          else
            echo "::notice title=Skipped::npm could not publish."
            echo "Configure a trusted publisher on npmjs.com for"
            echo "  shubham001312/imurun · workflow.yml · environment npm,"
            echo "or add an NPM_TOKEN secret to the repository. The release"
            echo "itself is unaffected; only the npm publish is skipped."
          fi
