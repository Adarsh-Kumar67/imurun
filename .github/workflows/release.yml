# IMURUN — release
#
# Compiles the standalone executables for every supported platform and
# attaches them to the GitHub release, next to the npm tarball. The
# binaries are the "install it and it just works" path: no Bun, no npm,
# no Python — one file and a PATH entry.
#
# Triggered by pushing a tag (v0.1.1).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-windows-x64
            os: windows-latest
          - target: bun-linux-x64
            os: ubuntu-latest
          - target: bun-linux-arm64
            os: ubuntu-24.04-arm
          - target: bun-darwin-x64
            os: macos-13
          - target: bun-darwin-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run package -- --binaries --targets=${{ matrix.target }}

      - name: Collect the artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp dist/package/binaries/* artifacts/
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: imurun-${{ matrix.target }}
          path: artifacts/
          retention-days: 7

  release:
    name: Publish the release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Build the npm tarball
        run: |
          bun install --frozen-lockfile
          bun run package
          mkdir -p package
          cp -r dist/package/npm/imurun/. package/
          tar -czf imurun-npm.tgz package

      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "IMURUN ${GITHUB_REF_NAME}" \
            --generate-notes \
            binaries/* imurun-npm.tgz || \
          gh release upload "${GITHUB_REF_NAME}" binaries/* imurun-npm.tgz --clobber
